plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.11'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'jacoco'
	id 'info.solidsoft.pitest' version 'latest.release'

}

group = 'com.reto'
version = '1.0'
sourceCompatibility = '11'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	implementation "org.mapstruct:mapstruct:1.5.3.Final"
	compileOnly "org.projectlombok:lombok:1.18.24"
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"
	annotationProcessor "org.mapstruct:mapstruct-processor:1.5.3.Final"
	annotationProcessor "org.projectlombok:lombok:1.18.24"
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation "org.springdoc:springdoc-openapi-webflux-ui:1.6.9"
	implementation "org.springdoc:springdoc-openapi-ui:1.6.11"

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.30.2'

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

compileJava {
	options.compilerArgs = ['-Amapstruct.defaultComponentModel=spring']
}

jacoco {
	toolVersion = "0.8.8"
}

test {
	finalizedBy jacocoTestReport
	jacoco {
		excludes = ['com.reto.plazoleta.infraestructure.drivenadapter.jpa.entity.*',
					'com.reto.plazoleta.infraestructure.drivenadapter.webclients.dto.*',
					'com.reto.plazoleta.domain.model.*',
					'com.reto.plazoleta.application.dto.*']
	}
}

pitest {
	targetClasses = [
			'com.reto.plazoleta.domain.usecase.*',
			'com.reto.plazoleta.infraestructure.entrypoint.*'
	]
	pitestVersion = 'latest.release'
	//mutationThreshold = 80
	outputFormats = ['HTML']
	threads = Runtime.getRuntime().availableProcessors()
	timestampedReports = false
	junit5PluginVersion = '1.0.0'
	verbose = false
	//mutators = ['ALL']

	println "Available processors: ${Runtime.runtime.availableProcessors()}"
}